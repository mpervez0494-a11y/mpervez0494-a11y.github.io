<style>

    margin:0;
    padding:0;
}

body{

header{

.action:hover{

/* IMAGE COMPRESSOR */

function compressImage(){

let file =
document.getElementById('compressFile').files[0];

if(!file){

alert('Please select an image.');

return;

}

let quality =
parseFloat(document.getElementById('quality').value);

let reader =
new FileReader();

reader.onload=function(e){

let img =
new Image();

img.onload=function(){

let canvas =
document.createElement('canvas');

canvas.width =
img.width;

canvas.height =
img.height;

let ctx =
canvas.getContext('2d');

ctx.drawImage(img,0,0);

canvas.toBlob(function(blob){

let url =
URL.createObjectURL(blob);

document.getElementById('compressResult').innerHTML =

'<p>Original Size: ' +
(file.size/1024).toFixed(2) +
' KB</p>' +

'<p>Compressed Size: ' +
(blob.size/1024).toFixed(2) +
' KB</p>' +

'<a class="download" download="compressed-image.jpg" href="' +
url +
'">Download Compressed Image</a>';

},'image/jpeg',quality);

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}


/* RESIZER */

function resizeImage(){

let file =
document.getElementById('resizeFile').files[0];

let width =
parseInt(document.getElementById('resizeWidth').value);

let height =
parseInt(document.getElementById('resizeHeight').value);

if(!file || !width || !height){

alert('Please select image and enter width & height.');

return;

}

let reader =
new FileReader();

reader.onload=function(e){

let img =
new Image();

img.onload=function(){

let canvas =
document.createElement('canvas');

canvas.width=width;

canvas.height=height;

let ctx =
canvas.getContext('2d');

ctx.drawImage(
img,
0,
0,
width,
height
);

canvas.toBlob(function(blob){

let url =
URL.createObjectURL(blob);

document.getElementById('resizeResult').innerHTML=

'<img class="preview" src="'+url+'">' +

'<a class="download" download="resized-image.jpg" href="'+
url+
'">Download Resized Image</a>';

},'image/jpeg',.9);

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}


/* JPG TO PNG */

function convertJpgPng(){

let file =
document.getElementById('jpgFile').files[0];

if(!file){

alert('Please select JPG image.');

return;

}

let reader =
new FileReader();

reader.onload=function(e){

let img =
new Image();

img.onload=function(){

let canvas =
document.createElement('canvas');

canvas.width =
img.width;

canvas.height =
img.height;

canvas.getContext('2d')
.drawImage(img,0,0);

let url =
canvas.toDataURL('image/png');

document.getElementById('jpgResult').innerHTML=

'<a class="download" download="converted.png" href="'+

/* PNG TO JPG */

function convertPngJpg(){

let file =
document.getElementById('pngFile').files[0];

if(!file){

alert('Please select PNG image.');

return;

}

let reader =
new FileReader();

reader.onload=function(e){

let img =
new Image();

img.onload=function(){

let canvas =
document.createElement('canvas');

canvas.width =
img.width;

canvas.height =
img.height;

let ctx =
canvas.getContext('2d');

ctx.fillStyle='white';

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.drawImage(img,0,0);

let url =
canvas.toDataURL(
'image/jpeg',
.9
);

document.getElementById('pngResult').innerHTML=

'<img class="preview" src="'+url+'">' +

'<a class="download" download="converted.jpg" href="'+
url+
'">Download JPG</a>';

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}

/* AGE CALCULATOR */

function calculateAge(){

let dob =
new Date(
document.getElementById('dob').value
);

let target =
new Date(
document.getElementById('ageDate').value
);

if(isNaN(dob) || isNaN(target)){

alert('Please select both dates.');

return;

}

if(target < dob){

alert(
'Calculation date cannot be before birth date.'
);

return;

}

let years =
target.getFullYear()
-
dob.getFullYear();

let months =
target.getMonth()
-
dob.getMonth();

let days =
target.getDate()
-
dob.getDate();

if(days<0){

months--;

let previousMonth =
new Date(
target.getFullYear(),
target.getMonth(),
0
);

days +=
previousMonth.getDate();

}

if(months<0){

years--;

months+=12;

}

document.getElementById('ageResult').innerHTML=

'<h3>Your Age:</h3>' +

'<p><strong>'+
years+
'</strong> Years, <strong>'+
months+
'</strong> Months, <strong>'+
days+
'</strong> Days</p>';

}


/* PERCENTAGE */

function calculatePercentage(){

let obtained =
parseFloat(
document.getElementById('obtained').value
);

let total =
parseFloat(
document.getElementById('total').value
);

if(!total || obtained<0){

alert('Enter valid marks.');

return;

}

let percentage =
(obtained/total)*100;

document.getElementById(
'percentageResult'
).innerHTML=

'<strong>Percentage: '+
percentage.toFixed(2)+
'%</strong>';

}


function findPercent(){

let percent =
parseFloat(
document.getElementById('percentValue').value
);

let number =
parseFloat(
document.getElementById('numberValue').value
);

if(
isNaN(percent) ||
isNaN(number)
){

alert('Enter valid numbers.');

return;

}

let result =
(percent/100)*number;

document.getElementById(
'percentResult'
).innerHTML=

'<strong>Answer: '+
result.toFixed(2)+
'</strong>';

}


/* EMI */

function calculateEMI(){

let P =
parseFloat(
document.getElementById('loan').value
);

let annual =
parseFloat(
document.getElementById('interest').value
);

let years =
parseFloat(
document.getElementById('years').value
);

if(!P || !annual || !years){

alert('Please enter all values.');

return;

}

let r =
annual/12/100;

let n =
years*12;

let emi =
P*r*Math.pow(1+r,n)/
(
Math.pow(1+r,n)-1
);

let totalPayment =
emi*n;

let totalInterest =
totalPayment-P;

document.getElementById(
'emiResult'
).innerHTML=

'<p><strong>Monthly EMI:</strong> '+
emi.toFixed(2)+
'</p>' +

'<p><strong>Total Payment:</strong> '+
totalPayment.toFixed(2)+
'</p>' +

'<p><strong>Total Interest:</strong> '+
totalInterest.toFixed(2)+
'</p>';

}


/* QR CODE */

function generateQR(){

let text =
document.getElementById(
'qrText'
).value.trim();

if(!text){

alert('Enter text or URL.');

return;

}

let qr =
document.getElementById('qr');

qr.innerHTML='';

new QRCode(
qr,
{
text:text,
width:220,
height:220
}
);

document.getElementById(
'qrDownload'
).style.display=
'inline-block';

}


function downloadQR(){

let img =
document.querySelector(
'#qr img'
);

if(!img){

alert(
'Generate QR code first.'
);

return;

}

let link =
document.createElement('a');

link.href =
img.src;

link.download =
'mp-tools-qr-code.png';

link.click();

}


/* WORD COUNTER */

function countText(){

let text =
document.getElementById(
'counterText'
).value;

let words =
text.trim()
?
text.trim().split(/\s+/).length
:
0;

let characters =
text.length;

let charactersNoSpace =
text.replace(/\s/g,'').length;

let lines =
text
?
text.split(/\n/).length
:
0;

document.getElementById(
'words'
).textContent =
words;

document.getElementById(
'characters'
).textContent =
characters;

document.getElementById(
'charactersNoSpace'
).textContent =
charactersNoSpace;

document.getElementById(
'lines'
).textContent =
lines;

}
